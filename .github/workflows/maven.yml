name: SauceDemo Regression Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Select Browser to run tests'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - edge

jobs:
  regression-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Automation Tests
        shell: powershell
        run: |
          $SelectedBrowser = "${{ github.event.inputs.browser }}"
          if (-not $SelectedBrowser) { $SelectedBrowser = "chrome" }
          
          Write-Output "Running tests on: $SelectedBrowser"
          mvn clean test "-Dbrowser=$SelectedBrowser" "-Dmaven.test.failure.ignore=true"

      - name: Archive Surefire Reports (HTML results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: target/surefire-reports/

      - name: Archive Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-artifact
          path: allure-results/