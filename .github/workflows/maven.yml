name: SauceDemo Regression Automation CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

  # 🎯 ميزة تشغيل التيست يدوي من جيت هاب واختيار البراوزر
  workflow_dispatch:
    inputs:
      browser:
        description: 'Select Browser to run tests'
        required: true
        default: 'edge'
        type: choice
        options:
          - chrome
          - edge

jobs:
  regression-tests:
    # استخدام Windows لضمان تشغيل الكروم والإيدج natively بدون مشاكل headless معقدة
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # تسرع الرن المرة الجاية عن طريق كاش الـ dependencies

      - name: Run Automation Tests
        shell: powershell
        run: |
          # التأكد من لقط البراوزر المختار يدوي، أو تشغيل الكروم كإفتراضي مع الـ Push
          $SelectedBrowser = "${{ github.event.inputs.browser }}"
          if (-not $SelectedBrowser) { $SelectedBrowser = "chrome" }
          
          System.out.println("Running tests on: $SelectedBrowser")
          mvn clean test "-Dbrowser=$SelectedBrowser"

      - name: Archive Surefire Reports (HTML results)
        if: always() # يشتغل حتى لو التيست سقط عشان تشوف مين سقط
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: target/surefire-reports/

      - name: Archive Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-artifact
          path: allure-results/